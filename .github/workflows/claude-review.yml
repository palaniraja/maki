name: Claude Review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
      EXTRA: ${{ github.event.comment.body }}
      REVIEW_PROMPT: ${{ vars.REVIEW_PROMPT }}
      REVIEW_MODEL: ${{ vars.REVIEW_MODEL || 'claude-opus-5-5' }}
    steps:
      - run: npm install -g @anthropic-ai/claude-code
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: gh pr checkout "$PR"
      - name: Review
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$REVIEW_PROMPT" ]; then
            echo "::error::Set the REVIEW_PROMPT repository variable"
            exit 1
          fi
          prompt="${REVIEW_PROMPT//\$PR/$PR}"
          prompt="${prompt//\$REPO/$GITHUB_REPOSITORY}"
          claude -p "$prompt
          ${EXTRA#/review}" \
            --model "$REVIEW_MODEL" \
            --allowedTools "Read,Grep,Glob,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git blame:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*)" \
            --output-format stream-json --verbose \
            | jq -j --unbuffered '
              if .type == "assistant" then .message.content[]
                | if .type == "text" then .text + "\n"
                  elif .type == "tool_use" then "> \(.name) \(.input | tostring | .[0:300])\n"
                  else empty end
              elif .type == "result" then
                "\n== \(.subtype) turns=\(.num_turns) cost=$\(.total_cost_usd) denied=\(.permission_denials // [] | length)\n"
              else empty end'
