name: Claude Review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
      EXTRA: ${{ github.event.comment.body }}
      REVIEW_PROMPT: ${{ vars.REVIEW_PROMPT }}
      REVIEW_MODEL: ${{ vars.REVIEW_MODEL || 'claude-opus-5-5' }}
      REVIEW_EFFORT: ${{ vars.REVIEW_EFFORT || 'high' }}
      SCRATCH_DIR: /tmp/claude-review
    steps:
      - run: npm install -g @anthropic-ai/claude-code
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: gh pr checkout "$PR"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: vars.REVIEW_APP_ID != ''
        with:
          app-id: ${{ vars.REVIEW_APP_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
      - name: Review
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REVIEWER: ${{ steps.app-token.outputs.app-slug || 'github-actions' }}
        run: |
          if [ -z "$REVIEW_PROMPT" ]; then
            echo "::error::Set the REVIEW_PROMPT repository variable"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ] &&
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --jq '.[].user.login' | grep -xF "$REVIEWER[bot]" >/dev/null; then
            echo "Already reviewed, comment /review to review again"
            exit 0
          fi
          mkdir -p "$SCRATCH_DIR"
          prompt="${REVIEW_PROMPT//\$PR/$PR}"
          prompt="${prompt//\$REPO/$GITHUB_REPOSITORY}"
          prompt="${prompt//\$REVIEWER/$REVIEWER}"
          claude -p "$prompt
          ${EXTRA#/review}" \
            --model "$REVIEW_MODEL" \
            --effort "$REVIEW_EFFORT" \
            --settings '{"attribution":{"commit":"","pr":""},"includeCoAuthoredBy":false}' \
            --add-dir "$SCRATCH_DIR" \
            --allowedTools "Read,Grep,Glob,Edit(/$SCRATCH_DIR/**),Write(/$SCRATCH_DIR/**),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git blame:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*)" \
            --output-format stream-json --verbose \
            | jq -j --unbuffered '
              if .type == "assistant" then .message.content[]
                | if .type == "text" then .text + "\n"
                  elif .type == "tool_use" then "> \(.name) \(.input | tostring | .[0:300])\n"
                  else empty end
              elif .type == "result" then
                "\n== \(.subtype) turns=\(.num_turns) cost=$\(.total_cost_usd)\n",
                (.permission_denials // [] | .[] | "denied: \(.tool_name) \(.tool_input | tostring | .[0:300])\n")
              else empty end'
